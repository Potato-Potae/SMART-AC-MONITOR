<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART AC MONITOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ====== สีหลัก (อยากเปลี่ยนสีทั้งเว็บ แก้ตรงนี้ที่เดียว) ====== */
:root {
    --bg: #f1f5f4;        /* พื้นหลังเว็บ */
    --card: #ffffff;      /* พื้นการ์ด */
    --ink: #10242b;       /* สีตัวอักษรหลัก / แถบเมนู */
    --muted: #6b7f86;     /* ตัวอักษรรอง */
    --line: #e1e9e8;      /* เส้นขอบ */
    --brand: #0e7c86;     /* สีหลักของระบบ */
    --on: #12a150;        /* แอร์เปิด */
    --on-soft: #e3f6ea;
    --off: #e5484d;       /* แอร์ปิด */
    --off-soft: #fdeaea;
    --offline: #8a9ba1;   /* ติดต่อไม่ได้ */
    --offline-soft: #edf1f2;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Prompt', Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
}

/* ====== โครงหน้า: แถบเมนูซ้าย + เนื้อหา ====== */
.layout { display: flex; min-height: 100vh; }

.sidebar {
    width: 250px;
    background: var(--ink);
    color: #b9cdd1;
    padding: 24px 16px;
    position: sticky;
    top: 0;
    height: 100vh;
    flex-shrink: 0;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    color: white;
    font-size: 18px;
    font-weight: 600;
    padding: 0 10px 24px;
}

.brand-logo {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--brand);
    display: grid;
    place-items: center;
    font-size: 22px;
}

.menu-title {
    font-size: 13px;
    color: #7f979c;
    padding: 14px 12px 6px;
}

.menu a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    margin-bottom: 4px;
    border-radius: 10px;
    color: #b9cdd1;
    text-decoration: none;
    font-size: 16px;
}

.menu a:hover { background: rgba(255, 255, 255, 0.08); color: white; }
.menu a.active { background: var(--brand); color: white; }

/* จุดสีสถานะข้างชื่อเมนูแอร์ */
.menu .mini-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-left: auto;
}
.mini-dot.on  { background: #3ddc84; }
.mini-dot.off { background: #ff6b70; }
.mini-dot.offline { background: #7f979c; }

.main { flex: 1; padding: 28px 32px; min-width: 0; }

/* ====== แถบด้านบน ====== */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 26px;
}

.topbar h1 { margin: 0; font-size: 28px; font-weight: 600; }
.topbar p  { margin: 4px 0 0; color: var(--muted); font-size: 15px; }

.tools { display: flex; align-items: center; gap: 10px; }

.chip {
    background: var(--card);
    border: 1px solid var(--line);
    padding: 9px 15px;
    border-radius: 999px;
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
}
.chip strong { color: var(--ink); font-weight: 500; }

.btn-refresh {
    background: var(--brand);
    color: white;
    text-decoration: none;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
}
.btn-refresh:hover { filter: brightness(1.1); }

/* ====== กล่องสรุป ====== */
.summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
}

.stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
}

.stat-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-size: 24px;
    background: #e3f1f2;
}
.stat.on  .stat-icon { background: var(--on-soft); }
.stat.off .stat-icon { background: var(--off-soft); }
.stat.offline .stat-icon { background: var(--offline-soft); }

.stat span   { color: var(--muted); font-size: 14px; }
.stat strong { display: block; font-size: 28px; font-weight: 600; }
.stat.on strong { color: var(--on); }
.stat.off strong { color: var(--off); }

.section-title { font-size: 20px; font-weight: 600; margin: 0 0 14px; }

/* ====== การ์ดแอร์ ====== */
.aircons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.ac {
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 5px solid var(--off);
    border-radius: 16px;
    padding: 22px;
    transition: 0.2s;
}
.ac.on { border-top-color: var(--on); }
.ac.offline { border-top-color: var(--offline); }
.ac:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(16, 36, 43, 0.1); }

.ac-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.ac-head h2 { margin: 0; font-size: 22px; font-weight: 600; }

.pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 13px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
}
.pill i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.on  { background: var(--on-soft);  color: var(--on); }
.pill.off { background: var(--off-soft); color: var(--off); }
.pill.offline { background: var(--offline-soft); color: var(--offline); }

.ac-temp {
    font-size: 56px;
    font-weight: 600;
    margin: 18px 0 4px;
    line-height: 1;
}
.ac-temp span { font-size: 22px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.ac.off .ac-temp, .ac.offline .ac-temp { color: #b4c1c5; }

.ac-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 18px;
}

.ac a {
    display: block;
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    background: var(--ink);
    color: white;
    text-decoration: none;
    font-weight: 500;
}
.ac a:hover { background: var(--brand); }

/* ====== มือถือ: เมนูย้ายไปอยู่ด้านล่าง ====== */
@media (max-width: 800px) {
    .layout { display: block; }

    .sidebar {
        position: fixed;
        bottom: 0; left: 0; right: 0; top: auto;
        width: 100%;
        height: auto;
        padding: 6px 4px;
        z-index: 10;
    }
    .brand, .menu-title, .desktop-only { display: none; }

    .menu { display: flex; justify-content: space-around; }
    .menu a {
        flex-direction: column;
        gap: 2px;
        padding: 6px 8px;
        font-size: 12px;
        margin: 0;
    }
    .menu .mini-dot { display: none; }

    .main { padding: 18px 16px 90px; }
    .topbar { flex-direction: column; align-items: flex-start; }
    .topbar h1 { font-size: 23px; }
    .summary { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { padding: 14px; gap: 12px; }
    .stat strong { font-size: 22px; }
    .stat-icon { width: 40px; height: 40px; font-size: 20px; }
    .aircons { grid-template-columns: 1fr; }
}
    

/* ====== กล่องแจ้งเตือน ====== */
.alerts {
    background: #fff4e0;
    border: 1px solid #f5c26b;
    color: #7a4b00;
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 24px;
    display: none;
}
.alerts.show { display: block; }
.alerts strong { display: block; margin-bottom: 4px; }
.alerts div { font-size: 15px; line-height: 1.7; }

/* ====== หน้ารายละเอียดแอร์ ====== */
.back { color: var(--muted); text-decoration: none; font-size: 14px; }
.back:hover { color: var(--brand); }

.hero {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 8px solid var(--off);
    border-radius: 16px;
    padding: 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 18px;
}
.hero.on { border-left-color: var(--on); }
.hero.offline { border-left-color: var(--offline); }
.hero h2 { margin: 0 0 10px; font-size: 26px; font-weight: 600; }
.hero .big { font-size: 64px; font-weight: 600; line-height: 1; }
.hero .big b { font: inherit; }
.hero .big span { font-size: 24px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.hero .big-label { color: var(--muted); font-size: 14px; text-align: right; margin-top: 6px; }

.tiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 18px;
}
.tile {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
}
.tile span   { color: var(--muted); font-size: 14px; }
.tile strong { display: block; font-size: 28px; font-weight: 600; margin-top: 4px; }
.tile strong small { font-size: 16px; color: var(--muted); font-weight: 400; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

.card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
}
.card h3 { margin: 0 0 14px; font-size: 18px; font-weight: 600; }

.row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-top: 1px solid var(--line);
    font-size: 15px;
}
.row span { color: var(--muted); }
.row strong { font-weight: 500; }

@media (max-width: 800px) {
    .hero { flex-direction: column; align-items: flex-start; }
    .hero .big { font-size: 52px; }
    .hero .big-label { text-align: left; }
    .tiles { gap: 8px; }
    .tile { padding: 12px 8px; text-align: center; }
    .tile strong { font-size: 20px; }
    .two { grid-template-columns: 1fr; }
}

</style>
</head>

<body>
<div class="layout">

    <nav class="sidebar">
        <div class="brand">
            <div class="brand-logo">❄️</div>
            Smart AC
        </div>

        <div class="menu">
            <a href="index.html" class="active">🏠 หน้าหลัก</a>

            <div class="menu-title">เครื่องปรับอากาศ</div>
            <a href="ac1.html" data-ac="1">❄️ แอร์ 1 <span class="mini-dot offline" id="dot1"></span></a>
            <a href="ac2.html" data-ac="2">❄️ แอร์ 2 <span class="mini-dot offline" id="dot2"></span></a>
            <a href="ac3.html" data-ac="3">❄️ แอร์ 3 <span class="mini-dot offline" id="dot3"></span></a>
            <a href="ac4.html" data-ac="4">❄️ แอร์ 4 <span class="mini-dot offline" id="dot4"></span></a>

            <div class="menu-title desktop-only">อื่น ๆ</div>
            <a href="#" class="desktop-only">📊 รายงาน</a>
            <a href="#" class="desktop-only">⚙️ ตั้งค่า</a>
        </div>
    </nav>

    <main class="main">

        <div class="topbar">
            <div>
                <h1>ภาพรวมเครื่องปรับอากาศ</h1>
                <p>ระบบตรวจสอบสถานะการทำงานของเครื่องปรับอากาศ</p>
            </div>
            <div class="tools">
                <div class="chip">↻ อัปเดตล่าสุด <strong id="time">--:--:--</strong></div>
                <a href="index.html" class="btn-refresh">รีเฟรช</a>
            </div>
        </div>

        <!-- กล่องแจ้งเตือน (โชว์เมื่อมีปัญหา) -->
        <div class="alerts" id="alerts"></div>

        <!-- สรุป -->
        <div class="summary">
            <div class="stat">
                <div class="stat-icon">❄️</div>
                <div><span>แอร์ทั้งหมด</span><strong id="sTotal">4</strong></div>
            </div>
            <div class="stat on">
                <div class="stat-icon">🟢</div>
                <div><span>เปิดอยู่</span><strong id="sOn">0</strong></div>
            </div>
            <div class="stat off">
                <div class="stat-icon">🔴</div>
                <div><span>ปิดอยู่</span><strong id="sOff">0</strong></div>
            </div>
            <div class="stat offline">
                <div class="stat-icon">📡</div>
                <div><span>ออฟไลน์</span><strong id="sOffline">0</strong></div>
            </div>
        </div>

        <h2 class="section-title">รายการเครื่องปรับอากาศ</h2>

        <!-- การ์ดแอร์ 4 ตัว (สร้างอัตโนมัติจาก config.js) -->
        <div class="aircons" id="cards"></div>

    </main>
</div>

<script src="config.js"></script>
<script>
function cardHTML(i, r) {
    const d = r.data || {};
    return `
    <div class="ac ${r.state}">
        <div class="ac-head">
            <h2>${CONFIG.ACS[i].name}</h2>
            <span class="pill ${r.state}"><i></i>${STATE_TEXT[r.state]}</span>
        </div>
        <div class="ac-temp">${fmt(d.temp, 1)}<span>°C</span></div>
        <div class="ac-meta">
            <span>⚡ ${fmt(d.voltage, 0)} V</span>
            <span>🔌 ${fmt(d.current, 2)} A</span>
            <span>💡 ${fmt(d.power, 0)} W</span>
        </div>
        <a href="ac${i + 1}.html">ดูรายละเอียด</a>
    </div>`;
}

async function refresh() {
    const results = await Promise.all(CONFIG.ACS.map((_, i) => loadAC(i)));

    document.getElementById("cards").innerHTML = results.map((r, i) => cardHTML(i, r)).join("");

    const count = s => results.filter(r => r.state === s).length;
    document.getElementById("sTotal").textContent   = results.length;
    document.getElementById("sOn").textContent      = count("on");
    document.getElementById("sOff").textContent     = count("off");
    document.getElementById("sOffline").textContent = count("offline");

    showAlerts(results.flatMap(r => r.warnings));
    updateDots(results);
    document.getElementById("time").textContent = nowTime();
}

refresh();
setInterval(refresh, CONFIG.INTERVAL);
</script>
</body>
</html>
